<svg xmlns="http://www.w3.org/2000/svg"
     width="200mm" height="95mm" viewBox="0 0 400 190"
     role="img" aria-labelledby="title desc">
  <title id="title">Что такое холст</title>
  <desc id="desc">Рабочая область SVG с началом координат, осями X и Y и центральной точкой.</desc>
  <rect x="1" y="1" width="398" height="188"
        fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <path d="M0 95 H400 M200 0 V190"
        fill="none" stroke="#cbd5e1" stroke-width="1"
        stroke-dasharray="5 5"/>
  <circle cx="200" cy="95" r="35"
          fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="200" cy="95" r="3" fill="#2563eb"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12"
     font-weight="400" fill="#0d0d0d">
    <text x="8" y="16">0, 0</text>
    <text x="245" y="84">Центр</text>
    <text x="350" y="85">X</text>
    <text x="208" y="168">Y</text>
  </g>
  <g fill="none" stroke="#0d0d0d" stroke-width="1.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M362 81 H383 M378 77 L383 81 L378 85"/>
    <path d="M216 172 V184 M212 180 L216 184 L220 180"/>
  </g>
