name: Experimental SVG editor checks and lesson deployment
on:
  push:
    branches: [experiment/vite-codemirror-editor]
    paths:
      - "experimental-editor/**"
      - ".github/workflows/experimental-editor.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: experimental-editor-checks
  cancel-in-progress: true
jobs:
  build-test-and-publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experimental-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build for tests
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run unit and browser tests
        run: npm test
      - name: Build for GitHub Pages
        run: SVG_WORKSHOP_PAGES=1 npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-svg-editor-build
          path: experimental-editor/dist
      - name: Check out the existing GitHub Pages source
        uses: actions/checkout@v4
        with:
          ref: main
          path: published-site
          persist-credentials: true
      - name: Publish the lesson under a separate URL
        working-directory: .
        run: |
          rm -rf published-site/lesson-01
          mkdir -p published-site/lesson-01
          cp -R experimental-editor/dist/. published-site/lesson-01/
          cd published-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lesson-01
          if git diff --cached --quiet; then
            echo "No published changes."
            exit 0
          fi
          git commit -m "Publish SVG Workshop lesson 01"
          git push origin HEAD:main
