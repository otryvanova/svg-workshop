name: Experimental SVG editor checks
on:
  push:
    branches: [experiment/vite-codemirror-editor]
    paths:
      - "experimental-editor/**"
      - ".github/workflows/experimental-editor.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experimental-editor-checks
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experimental-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-svg-editor-build
          path: experimental-editor/dist
